apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: subscriber-api-prod

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      environment: prod

configMapGenerator:
  - name: subscriber-api-config
    behavior: merge
    literals:
      - APP_ENV=prod
      - LOG_LEVEL=INFO

images:
  - name: ghcr.io/achrefmessai01/subscriber-api
    newTag: v0.1.0

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: subscriber-api
  - path: patch-route.yaml
    target:
      kind: Route
      name: subscriber-api
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
    target:
      kind: HorizontalPodAutoscaler
      name: subscriber-api
  - patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
    target:
      kind: PodDisruptionBudget
      name: subscriber-api
