apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: subscriber-api-dev

resources:
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      environment: dev

configMapGenerator:
  - name: subscriber-api-config
    behavior: merge
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=DEBUG

images:
  - name: ghcr.io/achrefmessai01/subscriber-api
    newTag: latest

patches:
  - path: patch-deployment.yaml
    target:
      kind: Deployment
      name: subscriber-api
  # A single replica is enough in dev; the HPA floor follows.
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: subscriber-api
  - patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
    target:
      kind: PodDisruptionBudget
      name: subscriber-api
