apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for subscriber-api on OpenShift. Environments are built from
# deploy/overlays/<env>, never from this directory directly.

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: subscriber-api
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: openshift-gcp-platform
      app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/achrefmessai01/subscriber-api
    newTag: latest
