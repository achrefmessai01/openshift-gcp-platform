---
extends: default

ignore: |
  reports/
  .venv/
  terraform/.terraform/

rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1
  # Required by ansible-lint: file modes must be quoted strings ("0600"), never bare octals.
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
