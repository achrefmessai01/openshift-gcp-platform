---
# ELK on OpenShift through the certified Elastic Cloud on Kubernetes (ECK) operator:
# Elasticsearch + Kibana in the logging namespace, Filebeat as a DaemonSet shipping every
# container log with Kubernetes metadata (autodiscover).

- name: Create the logging namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ logging.namespace }}"
        labels:
          openshift.io/cluster-monitoring: "true"

- name: Create the OperatorGroup (operator watches all namespaces)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: elastic-operators
        namespace: "{{ logging.namespace }}"
      spec: {}

- name: Subscribe to the certified ECK operator from OperatorHub
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: elasticsearch-eck-operator-certified
        namespace: "{{ logging.namespace }}"
      spec:
        channel: stable
        name: elasticsearch-eck-operator-certified
        source: certified-operators
        sourceNamespace: openshift-marketplace
        installPlanApproval: Automatic

- name: Wait for the ECK operator to be installed
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ logging.namespace }}"
  register: csvs
  until: >-
    csvs.resources
      | selectattr('metadata.name', 'match', '^elasticsearch-eck-operator-certified')
      | selectattr('status.phase', 'defined')
      | selectattr('status.phase', 'equalto', 'Succeeded') | list | length > 0
  retries: 30
  delay: 20

- name: Deploy Elasticsearch
  kubernetes.core.k8s:
    state: present
    template: elasticsearch.yaml.j2

- name: Deploy Kibana
  kubernetes.core.k8s:
    state: present
    template: kibana.yaml.j2

- name: Expose Kibana through a Route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: kibana
        namespace: "{{ logging.namespace }}"
      spec:
        to:
          kind: Service
          name: logging-kb-http
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

- name: Create the Filebeat service account and permissions
  kubernetes.core.k8s:
    state: present
    template: filebeat-rbac.yaml.j2

- name: Deploy Filebeat as a DaemonSet (Beat CRD)
  kubernetes.core.k8s:
    state: present
    template: filebeat.yaml.j2

- name: Wait for Elasticsearch to be healthy
  kubernetes.core.k8s_info:
    api_version: elasticsearch.k8s.elastic.co/v1
    kind: Elasticsearch
    name: logging
    namespace: "{{ logging.namespace }}"
  register: es
  until: es.resources | length > 0 and (es.resources[0].status.health | default('unknown')) in ['green', 'yellow']
  retries: 30
  delay: 20

- name: Show how to reach Kibana
  ansible.builtin.debug:
    msg: >-
      Kibana: https://$(oc -n {{ logging.namespace }} get route kibana -o jsonpath='{.spec.host}')
      user elastic, password: oc -n {{ logging.namespace }} get secret logging-es-elastic-user
      -o go-template='{{ '{{' }}.data.elastic | base64decode{{ '}}' }}'
